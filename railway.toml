[build]
builder = "RAILPACK"

[deploy]
startCommand = "/app/.venv/bin/python -m closure_supernet --db /data/closure_supernet.db serve --host 0.0.0.0 --no-autonomy"
healthcheckPath = "/supernet/interface/capabilities"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
