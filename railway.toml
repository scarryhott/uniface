[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/usr/local/bin/closure-supernet --db /data/closure_supernet.db serve --host 0.0.0.0 --no-autonomy"
healthcheckPath = "/network/proofs/capabilities"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
