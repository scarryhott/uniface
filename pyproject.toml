[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closure-supernet"
version = "3.8.0"
description = "One visual-translational Supernet closure joining Black Mirror Sense, SLEARN memory, AI translation, equality-class resources, and network return"
readme = "UNIFIED_SUPERNET_RUNTIME.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "scarryhott"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
closure-supernet = "closure_supernet.cli_supernet:main"

[tool.setuptools.packages.find]
include = ["closure_supernet*"]

[tool.vercel]
entrypoint = "asgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
