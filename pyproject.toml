[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closure-supernet"
version = "3.22.0"
description = "Supernet whose UI is the active-perspective translational-truth relation and universal return surface"
readme = "UNIFIED_SUPERNET_RUNTIME.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "scarryhott"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
legacy = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "mcp>=2,<3",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "mcp>=2,<3",
]

[project.scripts]
closure-supernet = "closure_supernet.cli_supernet:main"
closure-supernet-audit = "closure_supernet.archive_closure_audit_current:main"

[tool.setuptools.packages.find]
include = ["closure_supernet*"]

[tool.vercel]
entrypoint = "asgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
