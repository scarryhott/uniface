name: Closure Supernet Runtime CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run pytest
        shell: bash
        run: |
          set +e
          pytest -vv 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: error
      - run: python -m closure_supernet --db /tmp/closure.db status
