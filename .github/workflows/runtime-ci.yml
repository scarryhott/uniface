name: Closure Supernet Runtime CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run current closure lane
        shell: bash
        run: |
          set +e
          pytest -vv -m "not legacy_runtime" 2>&1 | tee pytest-core.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Run historical runtime compatibility lane
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest -vv -m legacy_runtime 2>&1 | tee pytest-legacy.log
          status=${PIPESTATUS[0]}
          echo "legacy_runtime_status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: |
            pytest-core.log
            pytest-legacy.log
          if-no-files-found: error
      - name: Check one published closure surface
        env:
          CLOSURE_DB_PATH: /tmp/closure.db
          CLOSURE_AUTONOMY_ENABLED: "false"
        run: |
          python - <<'PY'
          from closure_supernet.api_agent import app

          paths = {route.path for route in app.routes}
          required = {
              "/supernet/interface",
              "/supernet/interface/capabilities",
          }
          missing = sorted(required - paths)
          assert not missing, f"missing published closure routes: {missing}"
          assert "/supernet/closure-equations/resolve" not in paths
          assert "/supernet/closure-equations/capabilities" not in paths
          print("published projection closure healthy; research resolver remains opt-in")
          PY
