name: Closure Supernet Runtime CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify deterministic full-project closure
        shell: bash
        run: |
          set +e
          python -m closure_supernet.project_closure \
            --check \
            --require-full-repository \
            --pretty 2>&1 | tee project-closure.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Run current closure lane
        shell: bash
        run: |
          set +e
          pytest -vv -m "not legacy_runtime" 2>&1 | tee pytest-core.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Run retained historical natural-form lane
        shell: bash
        run: |
          set +e
          pytest -vv -m legacy_runtime 2>&1 | tee pytest-legacy.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-log-${{ github.run_id }}
          path: |
            project-closure.log
            pytest-core.log
            pytest-legacy.log
          if-no-files-found: error
      - name: Check one published closure surface
        env:
          CLOSURE_DB_PATH: /tmp/closure.db
          CLOSURE_AUTONOMY_ENABLED: "false"
        run: |
          python - <<'PY'
          from closure_supernet.api_agent import app

          paths = {route.path for route in app.routes}
          required = {
              "/supernet/interface",
              "/supernet/interface/capabilities",
              "/supernet/agent/capabilities",
              "/supernet/agent/self",
              "/mcp",
          }
          missing = sorted(required - paths)
          assert not missing, f"missing published closure routes: {missing}"
          assert "/supernet/closure-equations/resolve" not in paths
          assert "/supernet/closure-equations/capabilities" not in paths

          certificate = app.state.supernet_project_closure
          assert certificate["coverage"] == "FULL_REPOSITORY"
          assert certificate["project_closed"] is True
          assert certificate["translation_operator"] == "SUPERNET_TRANSLATE"
          assert certificate["semantic_carrier"] == "SUPERNET_CLOSURE_FORM"
          assert certificate["runtime_identity"] == "TRANSLATIONAL_TRUTH_CLASS"
          print(
              "published Supernet and retained project close through one "
              f"deterministic identity: {certificate['id']}"
          )
          PY
