# Smallest in-repo path for GitHub Pages from /docs.
# Enablement is a repo admin setting (Settings → Pages) and is not
# performed from a pull request. That seam stays OPEN until an admin
# turns Pages on. This workflow does not rewrite source notes, does not
# invent a host, and does not copy Slearn vinext.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
