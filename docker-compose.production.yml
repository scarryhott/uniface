services:
  closure-supernet:
    build: .
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - closure-supernet-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  closure-supernet-data:
